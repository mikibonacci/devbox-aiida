site_name: devbox-aiida
site_description: A ready-to-use AiiDA environment with PostgreSQL and RabbitMQ managed by devbox
site_url: https://mikibonacci.github.io/devbox-aiida/
repo_url: https://github.com/mikibonacci/devbox-aiida
repo_name: mikibonacci/devbox-aiida
docs_dir: docs
theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search
nav:
  - Home: index.md
  - Installation: installation.md
  - How-to:
      - Overview: how-to/index.md
      - Manage the services: how-to/services.md
      - Create and manage profiles: how-to/profiles.md
      - Set up computers and codes: how-to/computers-and-codes.md
      - Install pseudopotentials: how-to/pseudopotentials.md
      - Use Jupyter notebooks: how-to/jupyter.md
      - Install additional plugins: how-to/plugins.md
      - Troubleshooting: how-to/troubleshooting.md
  - Concepts:
      - Architecture: concepts/architecture.md
  - Reference:
      - Commands and scripts: reference/commands.md
      - Configuration and files: reference/configuration.md
